name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  python:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: histograph_test
          POSTGRES_USER: histograph
          POSTGRES_PASSWORD: histograph
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U histograph"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      HISTOGRAPH_DATABASE_URL: postgresql+asyncpg://histograph:histograph@localhost:5432/histograph_test
      HISTOGRAPH_TEST_DATABASE_URL: postgresql+asyncpg://histograph:histograph@localhost:5432/histograph_test
      HISTOGRAPH_ENCRYPTION_KEYS: test-v1:MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
      HISTOGRAPH_TOKEN_PEPPER: test-token-pepper-that-is-longer-than-thirty-two-characters
      HISTOGRAPH_BOOTSTRAP_TOKEN: test-bootstrap-token
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install -e '.[test]'
      - run: alembic upgrade head
      - run: alembic check
      - run: alembic downgrade base
      - run: alembic upgrade head
      - run: python -m ruff format --check .
      - run: python -m ruff check .
      - run: python -m pytest -q -p no:cacheprovider

  client:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm build

  container-images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker build --file infra/docker/api.Dockerfile --tag histograph-api:ci .
      - run: docker build --file infra/docker/worker.Dockerfile --tag histograph-worker:ci .
      - run: docker build --file infra/docker/client.Dockerfile --tag histograph-client:ci .
