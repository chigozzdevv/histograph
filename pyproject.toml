[project]
name = "histograph"
version = "0.1.0"
description = "Continuous assurance for DataHub-powered agents"
requires-python = ">=3.11,<3.15"
dependencies = [
    "aiosqlite>=0.21,<1",
    "alembic>=1.16,<2",
    "asyncpg>=0.30,<1",
    "boto3>=1.40,<2",
    "cryptography>=46,<51",
    "croniter>=6,<7",
    "fastapi>=0.116,<1",
    "httpx>=0.28,<1",
    "mcp>=1.24,<2",
    "pydantic>=2.11,<3",
    "pydantic-settings>=2.10,<3",
    "pyjwt[crypto]>=2.10,<3",
    "sqlalchemy[asyncio]>=2.0,<3",
    "sqlglot>=27,<28",
    "temporalio>=1.9,<2",
    "uvicorn[standard]>=0.35,<1",
]

[project.optional-dependencies]
test = [
    "pytest>=8.4,<9",
    "pytest-asyncio>=1.1,<2",
    "ruff>=0.12,<1",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/histograph"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests", "src"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "RUF"]

[tool.ruff.format]
quote-style = "double"
