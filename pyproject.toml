[project]
name = "histograph"
version = "0.1.0"
description = "Production ML incident response powered by DataHub lineage"
requires-python = ">=3.13,<3.14"
dependencies = [
    "clickhouse-connect>=0.8.18,<0.9",
    "fastapi>=0.116.1,<0.117",
    "mcp>=1.27.0,<2",
    "psycopg[binary,pool]>=3.2.9,<4",
    "pydantic>=2.11.7,<3",
    "pydantic-settings>=2.10.1,<3",
    "uvicorn[standard]>=0.35.0,<0.36",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1,<0.29",
    "pyrefly>=1.2.0,<2",
    "pytest>=8.4.1,<9",
    "pytest-asyncio>=1.1.0,<2",
    "ruff>=0.12.10,<0.13",
]

[tool.pytest.ini_options]
pythonpath = ["server/src"]
testpaths = ["server/tests"]
addopts = "-q"

[tool.pyrefly]
search_path = ["server/src"]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["server/src", "server/tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
